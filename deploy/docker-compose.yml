version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleek-iprs-postgres
    environment:
      POSTGRES_DB: fleek_iprs
      POSTGRES_USER: fleek_user
      POSTGRES_PASSWORD: fleek_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleek_user -d fleek_iprs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleek-iprs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: fleek-iprs-backend
    environment:
      NODE_ENV: development
      PORT: 8787
      DATABASE_URL: postgres://fleek_user:fleek_pass@postgres:5432/fleek_iprs
      IPRS_AUTH_SECRET: dev-secret-change-in-production
      RESEND_API_KEY: ""
      RESEND_FROM: "Fleek IPRS <noreply@localhost>"
      DARAJA_CONSUMER_KEY: ""
      DARAJA_CONSUMER_SECRET: ""
      DARAJA_SHORTCODE: ""
      DARAJA_PASSKEY: ""
      DARAJA_ENV: "sandbox"
      FRONTEND_URL: "http://localhost:5173"
      IPRS_CRON_SECRET: "dev-cron-secret"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: fleek-iprs-frontend
    environment:
      VITE_API_URL: http://localhost:8787
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist

volumes:
  postgres_data:
  redis_data: