# Render Blueprint for Fleek IPRS Backend
# Deploy: `render blueprint deploy render.yaml`
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fleek-iprs-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - fromDatabase:
          name: fleek-iprs-db
          property: connectionString
        key: DATABASE_URL
      - key: IPRS_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Fleek IPRS <noreply@fleek-iprs.co.ke>"
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_ENV
        value: "production"
      - key: FRONTEND_URL
        value: "https://fleek-iprs.co.ke"
      - key: IPRS_CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false

databases:
  - name: fleek-iprs-db
    databaseName: fleek_iprs
    user: fleek_user
    plan: starter
    region: frankfurt
    ipAllowList: []
    majorVersion: 16