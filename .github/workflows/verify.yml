name: verify

on:
  push:
    branches: ['**']
  pull_request:

# The gate is the same one that guards local development: npm run verify runs
# typecheck → lint → unit → build → API(114) → DOM(44) → write-flows(64) → traceability(96).
# No browser binary is needed — the DOM suites drive the real built bundle inside jsdom.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify (85 unit tests + 318 smoke assertions)
        run: npm ci && npm run verify

      - name: Upload the single-file bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error
