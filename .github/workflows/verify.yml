name: verify

on:
  push:
    branches: ['**']
  pull_request:

# The gate is the same one that guards local development: npm run verify runs
# typecheck → build → API(58) → DOM(44) → write-flows(63) → traceability(76).
# No browser binary is needed — the DOM suites drive the real built bundle inside jsdom.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck + build + 241 assertions)
        run: npm run verify

      - name: Upload the single-file bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/index.html
          if-no-files-found: error
